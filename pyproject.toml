[project]
name = "cjlu-curri2calen"
version = "0.1.0"
description = "Parse a school curriculum PDF and generate an ICS calendar file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.scripts]
curri2calen = "cjlu_curri2calen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cjlu_curri2calen"]
